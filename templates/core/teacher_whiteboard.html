{% extends 'core/teacher_portal_base.html' %}
{% block title %}السبورة التفاعلية{% endblock %}
{% block extra_css %}
<style>
.wb-toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px;}
.wb-group{background:#fff; border:1px solid var(--border); border-radius:14px; padding:8px 10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.wb-group span.lbl{font-size:0.75rem; color:var(--ink-muted); font-weight:700; margin-left:4px;}
.wb-color{width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--border); cursor:pointer;}
.wb-color.active{box-shadow:0 0 0 2.5px var(--violet-600);}
.wb-btn{width:38px; height:38px; border-radius:10px; border:1.6px solid var(--border); background:#fff; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center;}
.wb-btn.active{background:var(--violet-600); color:#fff; border-color:var(--violet-600);}
.wb-phrase-btn{padding:7px 12px; border-radius:10px; border:none; background:var(--green-soft); color:var(--green); font-weight:700; cursor:pointer; font-size:0.82rem;}
.wb-stage-wrap{position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow-md); height:70vh;}
.wb-bg{position:absolute; inset:0; z-index:0;}
.bg-rainbow{background:linear-gradient(120deg,#FFADAD,#FFD6A5,#FDFFB6,#CAFFBF,#9BF6FF,#A0C4FF,#BDB2FF);}
.bg-space{background:radial-gradient(circle at 20% 30%, #ffffff 1px, transparent 1.5px) 0 0/40px 40px, radial-gradient(circle at 60% 70%, #ffffff 1px, transparent 1.5px) 0 0/60px 60px, linear-gradient(160deg,#0B1030,#241B5E,#3C1E70);}
.bg-cartoon{background:linear-gradient(180deg,#7FDBFF 0%,#39A6FF 40%,#0B6FCB 100%);}
.bg-cartoon::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#fff3 10px,transparent 11px);background-size:70px 70px;}
.bg-pink{background:#FFD6EC;}
.bg-blue{background:#D6ECFF;}
.bg-yellow{background:#FFF6D6;}
.bg-white{background:#ffffff;}
.wb-canvas{position:relative; z-index:1; width:100%; height:100%; touch-action:none;}
.sticky{position:absolute; z-index:5; min-width:100px; min-height:90px; padding:10px; font-family:var(--font-body); font-weight:600; font-size:0.85rem; box-shadow:0 6px 16px rgba(0,0,0,0.15); cursor:move; border-radius:6px;}
.sticky textarea{width:100%; height:100%; border:none; background:transparent; resize:none; font-family:inherit; font-weight:inherit; font-size:inherit; outline:none;}
.sticky .del{position:absolute; top:-10px; left:-10px; background:#DC3545; color:#fff; border-radius:50%; width:20px; height:20px; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.sticky-square{background:#FFF7A8; transform:rotate(-1deg);}
.sticky-star{background:#FFD6E8; clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.cheer-text{position:absolute; z-index:10; top:40%; left:50%; transform:translate(-50%,-50%) scale(0.5); font-family:var(--font-display); font-weight:800; font-size:2.6rem; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,0.15); opacity:0; pointer-events:none; transition:all .35s ease-out;}
.cheer-text.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
#timer-display{position:absolute; z-index:8; top:14px; left:14px; background:rgba(255,255,255,0.9); border-radius:14px; padding:8px 16px; font-weight:800; font-size:1.3rem; display:none;}
</style>
{% endblock %}
{% block content %}
<h2 style="color:var(--violet-700); margin-top:0;">🖍️ السبورة التفاعلية</h2>

<div class="wb-toolbar">
    <div class="wb-group">
        <span class="lbl">القلم</span>
        <div class="wb-color active" style="background:#1A1A2E" data-color="#1A1A2E"></div>
        <div class="wb-color" style="background:#DC3545" data-color="#DC3545"></div>
        <div class="wb-color" style="background:#1D9A63" data-color="#1D9A63"></div>
        <div class="wb-color" style="background:#3B82F6" data-color="#3B82F6"></div>
        <div class="wb-color" style="background:#F59E0B" data-color="#F59E0B"></div>
        <div class="wb-color" style="background:#8B5CF6" data-color="#8B5CF6"></div>
        <div class="wb-color" style="background:#EC4899" data-color="#EC4899"></div>
        <button class="wb-btn active" id="tool-pen" title="قلم"><i class="fas fa-pen"></i></button>
        <button class="wb-btn" id="tool-eraser" title="ممحاة"><i class="fas fa-eraser"></i></button>
    </div>

    <div class="wb-group">
        <span class="lbl">أشكال</span>
        <button class="wb-btn shape-btn" data-shape="heart">❤️</button>
        <button class="wb-btn shape-btn" data-shape="star">⭐</button>
        <button class="wb-btn shape-btn" data-shape="crown">👑</button>
        <button class="wb-btn shape-btn" data-shape="flower">🌸</button>
        <button class="wb-btn shape-btn" data-shape="square">🟪</button>
    </div>

    <div class="wb-group">
        <span class="lbl">ملاحظات</span>
        <button class="wb-btn" id="add-note-square" title="ورقة مربعة">🟨</button>
        <button class="wb-btn" id="add-note-star" title="ورقة نجمة">🌟</button>
    </div>

    <div class="wb-group">
        <span class="lbl">الخلفية</span>
        <button class="wb-btn bg-btn active" data-bg="white">⚪</button>
        <button class="wb-btn bg-btn" data-bg="rainbow">🌈</button>
        <button class="wb-btn bg-btn" data-bg="space">🌌</button>
        <button class="wb-btn bg-btn" data-bg="cartoon">🐠</button>
        <button class="wb-btn bg-btn" data-bg="pink">🌸</button>
        <button class="wb-btn bg-btn" data-bg="blue">💙</button>
        <button class="wb-btn bg-btn" data-bg="yellow">💛</button>
    </div>

    <div class="wb-group">
        <span class="lbl">أصوات</span>
        <button class="wb-btn" id="sound-clap" title="تصفيق">👏</button>
        <button class="wb-btn" id="sound-timer" title="تايمر 30 ثانية">⏱️</button>
    </div>

    <button class="wb-btn" id="clear-board" title="مسح الكل"><i class="fas fa-trash"></i></button>
</div>

<div class="wb-group" style="margin-bottom:12px;">
    <span class="lbl">عبارات تشجيعية</span>
    <button class="wb-phrase-btn" data-phrase="✨ ممتاز ✨">ممتاز</button>
    <button class="wb-phrase-btn" data-phrase="👏 أحسنتِ 👏">أحسنتِ</button>
    <button class="wb-phrase-btn" data-phrase="🏆 بطل الحلقة 🏆">بطل الحلقة</button>
    <button class="wb-phrase-btn" data-phrase="🌟 ما شاء الله 🌟">ما شاء الله</button>
    <button class="wb-phrase-btn" data-phrase="💪 استمر كذلك 💪">استمر كذلك</button>
</div>

<div class="wb-stage-wrap" id="stage">
    <div class="wb-bg bg-white" id="wb-bg"></div>
    <canvas class="wb-canvas" id="board"></canvas>
    <div id="timer-display">30</div>
</div>

<script>
(function(){
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    let color = '#1A1A2E';
    let tool = 'pen'; // pen | eraser | shape
    let currentShape = null;
    let drawing = false;
    let last = null;

    function resize(){
        const rect = stage.getBoundingClientRect();
        const img = canvas.toDataURL();
        canvas.width = rect.width;
        canvas.height = rect.height;
        const image = new Image();
        image.onload = () => ctx.drawImage(image, 0, 0);
        image.src = img;
    }
    window.addEventListener('resize', resize);
    resize();

    function pos(e){
        const rect = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return {x: t.clientX - rect.left, y: t.clientY - rect.top};
    }

    const SHAPE_EMOJI = {heart:'❤️', star:'⭐', crown:'👑', flower:'🌸', square:'🟪'};

    function stampShape(p, shape){
        ctx.font = '52px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(SHAPE_EMOJI[shape], p.x, p.y);
    }

    canvas.addEventListener('pointerdown', e => {
        const p = pos(e);
        if(tool === 'shape'){ stampShape(p, currentShape); return; }
        drawing = true; last = p;
    });
    canvas.addEventListener('pointermove', e => {
        if(!drawing) return;
        const p = pos(e);
        ctx.lineWidth = tool === 'eraser' ? 26 : 5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = tool === 'eraser' ? '#FFFFFF' : color;
        ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        last = p;
    });
    ['pointerup','pointerleave'].forEach(ev => canvas.addEventListener(ev, () => drawing = false));

    // ألوان
    document.querySelectorAll('.wb-color').forEach(el => {
        el.addEventListener('click', () => {
            document.querySelectorAll('.wb-color').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            color = el.dataset.color;
            setTool('pen');
        });
    });

    function setTool(t, shape){
        tool = t; currentShape = shape || null;
        document.querySelectorAll('.wb-btn').forEach(b => b.classList.remove('active'));
        if(t === 'pen') document.getElementById('tool-pen').classList.add('active');
        if(t === 'eraser') document.getElementById('tool-eraser').classList.add('active');
        if(t === 'shape') document.querySelector('.shape-btn[data-shape="'+shape+'"]').classList.add('active');
    }
    document.getElementById('tool-pen').addEventListener('click', () => setTool('pen'));
    document.getElementById('tool-eraser').addEventListener('click', () => setTool('eraser'));
    document.querySelectorAll('.shape-btn').forEach(b => {
        b.addEventListener('click', () => setTool('shape', b.dataset.shape));
    });

    // الخلفية
    document.querySelectorAll('.bg-btn').forEach(b => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.bg-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            const bgEl = document.getElementById('wb-bg');
            bgEl.className = 'wb-bg bg-' + b.dataset.bg;
        });
    });

    // مسح الكل
    document.getElementById('clear-board').addEventListener('click', () => {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        document.querySelectorAll('.sticky').forEach(n => n.remove());
    });

    // ملاحظات لاصقة قابلة للسحب
    let noteZ = 6;
    function addNote(kind){
        const note = document.createElement('div');
        note.className = 'sticky sticky-' + kind;
        note.style.top = '30%'; note.style.left = '40%';
        note.style.zIndex = ++noteZ;
        note.innerHTML = '<div class="del">×</div><textarea placeholder="اكتب هنا..."></textarea>';
        stage.appendChild(note);
        note.querySelector('.del').addEventListener('click', () => note.remove());

        let dragging = false, offX=0, offY=0;
        note.addEventListener('pointerdown', e => {
            if(e.target.tagName === 'TEXTAREA') return;
            dragging = true; note.style.zIndex = ++noteZ;
            const r = note.getBoundingClientRect();
            offX = e.clientX - r.left; offY = e.clientY - r.top;
        });
        document.addEventListener('pointermove', e => {
            if(!dragging) return;
            const r = stage.getBoundingClientRect();
            note.style.left = (e.clientX - r.left - offX) + 'px';
            note.style.top = (e.clientY - r.top - offY) + 'px';
        });
        document.addEventListener('pointerup', () => dragging = false);
    }
    document.getElementById('add-note-square').addEventListener('click', () => addNote('square'));
    document.getElementById('add-note-star').addEventListener('click', () => addNote('star'));

    // أصوات مُولّدة بدون ملفات خارجية
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioCtx();
    function beep(freq, dur, delay, type){
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;
        o.connect(g); g.connect(actx.destination);
        const t0 = actx.currentTime + delay;
        g.gain.setValueAtTime(0.001, t0);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function playClap(){
        for(let i=0;i<6;i++) beep(1400 + Math.random()*600, 0.05, i*0.09, 'square');
    }
    function playTada(){ beep(523,0.15,0); beep(659,0.15,0.15); beep(784,0.3,0.3); }
    function playTick(){ beep(880,0.05,0,'square'); }
    function playRing(){ beep(1046,0.5,0); beep(1318,0.5,0.15); }

    document.getElementById('sound-clap').addEventListener('click', playClap);

    let timerInterval = null;
    document.getElementById('sound-timer').addEventListener('click', () => {
        if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
        let t = 30;
        const disp = document.getElementById('timer-display');
        disp.style.display = 'block';
        disp.textContent = t;
        timerInterval = setInterval(() => {
            t--; playTick();
            disp.textContent = t;
            if(t <= 0){
                clearInterval(timerInterval); timerInterval = null;
                disp.style.display = 'none';
                playRing();
            }
        }, 1000);
    });

    // عبارات تشجيعية
    const cheerColors = ['#EC4899','#8B5CF6','#3B82F6','#1D9A63','#F59E0B'];
    document.querySelectorAll('.wb-phrase-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const el = document.createElement('div');
            el.className = 'cheer-text';
            el.textContent = btn.dataset.phrase;
            el.style.color = cheerColors[Math.floor(Math.random()*cheerColors.length)];
            stage.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            playTada();
            setTimeout(() => { el.style.opacity = 0; }, 1800);
            setTimeout(() => el.remove(), 2200);
        });
    });
})();
</script>
{% endblock %}
