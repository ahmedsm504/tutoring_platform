{% comment %}حقول كلمة السر اللي الأدمن بتكتبها بنفسها (إنشاء حساب / تغيير كلمة السر){% endcomment %}
<div class="field" style="margin-top:14px;">
    <label>كلمة السر (إنتِ اللي بتحدديها) *</label>
    <input type="password" name="password" id="pw1" required minlength="6" autocomplete="new-password"
           style="width:100%; padding:12px; border-radius:12px; border:2px solid #ede9fe;">
</div>
<div class="field" style="margin-top:12px;">
    <label>تأكيد كلمة السر *</label>
    <input type="password" name="password2" id="pw2" required minlength="6" autocomplete="new-password"
           style="width:100%; padding:12px; border-radius:12px; border:2px solid #ede9fe;">
</div>
<label style="display:inline-flex; align-items:center; gap:6px; font-size:0.82rem; margin-top:8px; cursor:pointer;">
    <input type="checkbox" onchange="var t=this.checked?'text':'password'; document.getElementById('pw1').type=t; document.getElementById('pw2').type=t;">
    إظهار كلمة السر
</label>
<p class="text-muted" style="font-size:0.78rem; margin-top:4px;">6 حروف/أرقام على الأقل. كلمة السر مش بتتعرض بعد الحفظ، ابعتيها للشخص بنفسك.</p>
