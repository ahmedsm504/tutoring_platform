{% extends 'core/supervisor_portal_base.html' %}
{% block title %}دخول المشرفة{% endblock %}
{% block content %}
<div class="card" style="max-width:400px; margin:40px auto;">
    <h2 style="text-align:center; color:var(--violet-700);">🔐 دخول المشرفة</h2>
    <p style="text-align:center; color:var(--ink-muted); font-size:0.85rem;">
        الحساب ده خاص بالمشرفات بس، وبيوريكِ معلماتك وحلقاتهم فقط.
    </p>
    <form method="POST" style="margin-top:18px;">
        {% csrf_token %}
        <div class="field">
            <label>اسم المستخدم</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="field">
            <label>كلمة السر</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">دخول</button>
    </form>
    <p style="text-align:center; font-size:0.8rem; color:var(--ink-muted); margin-top:14px;">
        نسيتِ بيانات الدخول؟ كلمي الإدارة عشان تصفّرلك كلمة السر.
    </p>
</div>
{% endblock %}
