{% extends 'core/base.html' %}
{% block title %}تغيير كلمة السر - {{ person }}{% endblock %}
{% block content %}
<div style="max-width: 550px; margin: 30px auto; background: white; padding: 35px; border-radius: 24px; border: 1px solid #ede9fe;">
    <h2 style="color: #4a1a8a; text-align: center;">🔑 تغيير كلمة سر {{ kind }} {{ person }}</h2>
    <p class="text-muted" style="text-align:center; margin-top:8px;">
        اسم الدخول: <strong>{{ login_name }}</strong> - اكتبي كلمة السر الجديدة بنفسك.
    </p>
    <form method="POST" style="margin-top:20px;">
        {% csrf_token %}
        {% include 'core/_password_fields.html' %}
        <div style="text-align:center; margin-top:20px;">
            <button type="submit" class="btn btn-primary">حفظ كلمة السر</button>
            <a href="{{ back_url }}" class="btn btn-outline">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
