{% extends 'core/base.html' %}
{% block title %}إضافة مشرفة{% endblock %}
{% block content %}
<div style="max-width: 550px; margin: 30px auto; background: white; padding: 35px; border-radius: 24px; border: 1px solid #ede9fe;">
    <h2 style="color: #4a1a8a; text-align: center;">➕ إضافة مشرفة جديدة</h2>
    <form method="POST" style="margin-top:20px;">
        {% csrf_token %}
        <div class="field">
            <label>اسم المشرفة</label>
            <input type="text" name="name" required style="width:100%; padding:12px; border-radius:12px; border:2px solid #ede9fe;">
        </div>
        <div class="field">
            <label>رقم الهاتف (اختياري)</label>
            <input type="text" name="phone" style="width:100%; padding:12px; border-radius:12px; border:2px solid #ede9fe;">
        </div>
        <div style="text-align:center; margin-top:20px;">
            <button type="submit" class="btn btn-primary">إضافة</button>
            <a href="{% url 'supervisors_list' %}" class="btn btn-outline">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
