{% if request.user.is_authenticated %}{% load static %}
<style>
#lv-toasts{position:fixed; bottom:18px; left:18px; z-index:9999; display:flex; flex-direction:column; gap:10px; max-width:min(360px,calc(100vw - 36px));}
.lv-toast{position:relative; display:flex; gap:10px; align-items:flex-start; background:#fff; color:#1f1633; border-radius:16px; padding:12px 14px; box-shadow:0 12px 32px rgba(0,0,0,.18); text-decoration:none; border-right:5px solid #22C55E; animation:lvIn .25s ease-out; font-family:inherit;}
.lv-toast b{display:block; font-size:0.9rem; margin-bottom:2px;}
.lv-toast span{font-size:0.84rem; color:#5b4a7a; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
@keyframes lvIn{from{transform:translateY(16px); opacity:0;} to{transform:none; opacity:1;}}
#lv-enable{position:fixed; bottom:18px; right:18px; z-index:9998; background:#7C3AED; color:#fff; border:none; border-radius:999px; padding:10px 16px; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:0 8px 20px rgba(124,58,237,.35); display:none;}
#lv-enable small{display:block; font-weight:500; font-size:0.7rem; opacity:.85;}
#lv-enable .x{position:absolute; top:-6px; left:-6px; width:22px; height:22px; border-radius:50%; background:#fff; color:#7C3AED; font-size:0.75rem; line-height:22px; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,.2);}
@media (max-width:820px){ #lv-enable{bottom:auto; top:72px; right:12px; padding:8px 14px; font-size:0.8rem;} #lv-enable small{display:none;} #lv-toasts{bottom:auto; top:72px; left:12px; right:12px; max-width:none;} }
.js-chat-badge{background:#22C55E; color:#fff; border-radius:999px; padding:0 8px; font-size:0.75rem; font-weight:800; margin-inline-start:auto;}
.js-chat-badge:empty{display:none;}
</style>
<div id="lv-toasts" aria-live="polite"></div>
<button type="button" id="lv-enable">🔔 فعّل إشعارات الرسايل<small>عشان توصلك الرسايل حتى والموقع مقفول</small><span class="x" id="lv-x" title="مش دلوقتي">✕</span></button>
<script>
(function(){
  var URL_ = "{% url 'chat_unread' %}", KEY = 'lv_last_{{ request.user.pk }}';
  var CSRF = "{{ csrf_token }}";
  function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  var actx = null;
  document.addEventListener('click', function(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }, {once:true});
  function ding(){
    if(!actx) return;
    try { [[784,0],[1046,.13]].forEach(function(n){ var o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = n[0]; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, actx.currentTime + n[1]); g.gain.exponentialRampToValueAtTime(.3, actx.currentTime + n[1] + .02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + n[1] + .3); o.start(actx.currentTime + n[1]); o.stop(actx.currentTime + n[1] + .35); }); } catch(e){}
  }
  function toast(item){
    var a = document.createElement('a'); a.className = 'lv-toast'; a.href = item.url;
    var ic = document.createElement('div'); ic.textContent = '💬'; ic.style.fontSize = '1.4rem';
    var tx = document.createElement('div'); var b = document.createElement('b'); b.textContent = item.title;
    var s = document.createElement('span'); s.textContent = item.text; tx.appendChild(b); tx.appendChild(s);
    a.appendChild(ic); a.appendChild(tx); document.getElementById('lv-toasts').appendChild(a);
    setTimeout(function(){ a.remove(); }, 9000);
  }
  function paint(n){
    document.querySelectorAll('.js-chat-badge').forEach(function(el){ el.textContent = n > 0 ? n : ''; });
    var base = document.title.replace(/^\(\d+\) /, '');
    document.title = n > 0 ? '(' + n + ') ' + base : base;
  }
  var timer = null;
  function poll(){
    fetch(URL_, {credentials:'same-origin', headers:{'Accept':'application/json'}})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(!d) return;
        paint(d.count || 0);
        var it = d.latest, last = parseInt(get(KEY), 10) || 0;
        if(it && it.id > last){
          set(KEY, String(it.id));
          var onThread = location.pathname === it.url;
          if(last && !onThread){
            toast(it); ding();
            if(document.hidden && window.Notification && Notification.permission === 'granted' && !navigator.serviceWorker.controller){
              try { var n = new Notification(it.title, {body: it.text, tag: 'chat', icon: "{% static 'images/icon-192.png' %}"}); n.onclick = function(){ window.focus(); location.href = it.url; }; } catch(e){}
            }
          }
        }
      }).catch(function(){})
      .finally(function(){ clearTimeout(timer); timer = setTimeout(poll, document.hidden ? 25000 : 8000); });
  }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
  poll();

  // ===== إشعارات حتى والموقع مقفول (Firebase) =====
  var btn = document.getElementById('lv-enable');
  if(!('Notification' in window) || !('serviceWorker' in navigator)) return;
  async function register(ask){
    if(ask && Notification.permission !== 'granted'){
      if(await Notification.requestPermission() !== 'granted'){ btn.style.display = 'none'; return; }
    }
    btn.style.display = 'none';
    try {
      const [{ initializeApp }, { getMessaging, getToken }] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js"),
      ]);
      const app = initializeApp({
        apiKey: "AIzaSyC-X81jKdtfaMRblBEsIEl01OVga2Hqe2E", authDomain: "alagme-notifications.firebaseapp.com",
        projectId: "alagme-notifications", storageBucket: "alagme-notifications.firebasestorage.app",
        messagingSenderId: "914317417493", appId: "1:914317417493:web:2a9acda899a263a1c1821c"
      }, 'chat');
      const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      const token = await getToken(getMessaging(app), {
        vapidKey: "BDJXpC_xK5MZzmk7-qA1wiNAOYsOSIHZ6dWbjMGmX8p0hE9IB_Tp_lutxtN8tUC_hfqvlRym_3AniPt8IvfwmBQ",
        serviceWorkerRegistration: reg
      });
      if(token){
        await fetch('/save-fcm-token/', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json', 'X-CSRFToken': CSRF}, body: JSON.stringify({token})});
        set('lv_push_{{ request.user.pk }}', '1');
      }
    } catch(e){
      try { fetch('/save-fcm-token/', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json', 'X-CSRFToken': CSRF}, body: JSON.stringify({client_error: String((e && (e.code || e.name)) || '') + ': ' + String((e && e.message) || e).slice(0, 300), page: location.pathname})}); } catch(x){}
    }
  }
  if(Notification.permission === 'granted'){
    if(!sessionStorage.getItem('lv_reg')){ try { sessionStorage.setItem('lv_reg', '1'); } catch(e){} setTimeout(function(){ register(false); }, 2500); }
  } else if(Notification.permission === 'default' && !get('lv_dismiss_{{ request.user.pk }}')){
    btn.style.display = 'block';
    btn.addEventListener('click', function(e){
      if(e.target.id === 'lv-x'){ set('lv_dismiss_{{ request.user.pk }}', '1'); btn.style.display = 'none'; return; }
      register(true);
    });
  }
})();
</script>
{% endif %}
