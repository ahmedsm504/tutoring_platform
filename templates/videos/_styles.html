<style>
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;list-style:none;padding:0;margin:0}
.vcard{display:flex;flex-direction:column;gap:8px}
.vcard h3{font-size:1.05rem;margin:0;line-height:1.5}
.vcard h3 a{color:var(--ink);text-decoration:none}
.vcard h3 a:hover{color:var(--green)}
.vthumb{position:relative;display:block;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#152a8f;box-shadow:var(--shadow);border:3px solid #fff;outline:2px solid #c9d5ff}
.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.vthumb:hover img{transform:scale(1.06)}
.vplay{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:#ffc83d;display:grid;place-items:center;box-shadow:0 5px 0 #d99a00;transition:transform .15s}
.vthumb:hover .vplay{transform:scale(1.1)}
.vplay svg{width:24px;height:24px;color:#2a1a00;margin-inline-start:4px}
.vdur{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(10,18,60,.85);color:#fff;font-size:.8rem;padding:2px 8px;border-radius:8px}
.vcat{align-self:flex-start;font-size:.78rem;font-weight:700;padding:2px 12px;border-radius:999px;background:#e7ecff;color:#2747d9}
.vfeatured{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;background:var(--surface);border-radius:28px;padding:20px;box-shadow:var(--shadow);margin-bottom:36px;border:2px solid #ffe1a1}
.vfeatured h2{font-size:clamp(1.3rem,2.4vw,1.8rem);margin:8px 0}
.vfeatured p{color:var(--ink-soft);margin:0 0 16px}
@media(max-width:820px){.vfeatured{grid-template-columns:1fr}}
.vplayer{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#0f1d6b;box-shadow:0 20px 50px rgba(21,42,143,.25)}
.vplayer.short{aspect-ratio:9/16;max-width:380px;margin-inline:auto}
.vplayer button{all:unset;cursor:pointer;position:absolute;inset:0;display:block}
.vplayer img,.vplayer iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.vplayer .vplay{width:84px;height:84px}
.vplayer .vplay svg{width:34px;height:34px}
.vbody{max-width:860px}
.vcrumbs a{color:var(--green)}
.vbody .vdesc{white-space:pre-line;font-size:1.05rem;color:var(--ink-soft)}
</style>
