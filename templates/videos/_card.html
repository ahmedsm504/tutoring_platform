<article class="vcard" {% if v.is_english %}lang="en" dir="ltr"{% else %}lang="ar" dir="rtl"{% endif %}>
  <a class="vthumb{% if v.is_short %} short{% endif %}" href="{{ v.get_absolute_url }}">
    <img src="{{ v.thumbnail_url }}" alt="" width="480" height="360" loading="lazy" decoding="async">
    <span class="vplay" aria-hidden="true"><svg><use href="#i-play"/></svg></span>
    {% if v.duration %}<span class="vdur">{{ v.duration }}</span>{% endif %}
  </a>
  <span class="vcat">{{ v.get_category_display }}</span>
  <h3><a href="{{ v.get_absolute_url }}">{{ v.title }}</a></h3>
</article>
